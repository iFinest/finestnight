          - "lua/finestnight/groups/kinds.lua"
          - "lua/finestnight/groups/treesitter.lua"
          - "lua/finestnight/groups/semantic_tokens.lua"

colors:
  - changed-files:
      - any-glob-to-any-file: "lua/finestnight/colors/**"
